<div class="swiper hero overflow-visible px-g" data-type="hero" data-style="gallery" x-data="{
        element: '',
        swiper: config.carousels.hero.gallery
    }" x-init="
        this.element = $el;
        window.$.progress($($el).find('.js-progress'))
        this.swiper = window.initSwiper($el, swiper)
        this.swiper
            .findArrows()
            .findPagination()
            .init()

        if(typeof this.swiper.swiper.slides[1] !== 'undefined') {
            $dispatch('backgroundimage', {
                src: this.swiper.swiper.slides[1].getAttribute('backgroundimage')
            });
        }

        this.swiper.swiper.on('slideChange', (swiper) => {
            if(typeof swiper.swiper !== 'undefined') {
                if(typeof swiper.swiper.slides[1] !== 'undefined') {
                    $dispatch('backgroundimage', {
                        src: swiper.slides[swiper.activeIndex + 1].getAttribute('backgroundimage')
                    });
                }
            }
        });

        $nextTick(() => { this.swiper.swiper.update() })
    ">
